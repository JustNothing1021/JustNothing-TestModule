plugins {
    alias(libs.plugins.android.application)
}

// 构建期生成的 Hook 组件包清单常量放这里（由 generateHookPackRegistry 写）。
// 见 HookPackLoader 的类注释：这份清单必须是编译期常量，不能在 zygote 里读出来。
// （要不是我加了可拆分根本就不知道还有这一出）
def hookPackRegistryDir = file('build/generated/hookpack/java')


android {
    namespace = 'com.justnothing.testmodule'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.justnothing.testmodule"
        minSdk = 26
        targetSdk = 36
        versionCode = 50
        versionName = "0.4.10"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
        }

    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
            // 每个 Hook 组件包都带一份 hookpack.list。清单已经在构建期被并进 HookPackRegistry 常量，
            // 运行时不再需要它 —— 直接丢掉，顺便断绝"以后又有人去 classloader 里读它"的念想
            // （读了就会在 zygote 里把 APK 打开并留下 fd，见 HookPackLoader 的类注释）。
            excludes += ['hookpack.list']
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/*.so.*']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    sourceSets {
        main {
            resources {
                srcDirs = ['src/main/resources']
            }
        }

        getByName("main") {
            jniLibs.srcDirs("src/main/jniLibs")
            java.srcDir(hookPackRegistryDir)
        }
    }


    buildToolsVersion = '36.1.0'
    ndkVersion = '29.0.14206865'
}

configurations {
    all*.exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-ktx'
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material.v1110
    implementation libs.androidx.constraintlayout.v221
    implementation libs.bsh
    implementation libs.cfr
    // 只用到 dex2jar 的 DexFileReader + Dex2Asm。d2j-external 是给 d2j-* 命令行工具用的
    // （里面塞了 com.android.dex 和一份打包进去的 ASM），我们一个都不碰，留着只会让
    // org.objectweb.asm.* 和项目自己的 libs.asm 撞成 duplicate class。
    implementation(libs.dex2jar.translator) {
        exclude group: 'de.femtopedia.dex2jar', module: 'd2j-external'
    }
    implementation libs.hutool.all
    implementation libs.gson
    implementation libs.androidsvg.aar
    implementation libs.asm
    implementation libs.r8
    implementation libs.mpandroidchart
    implementation libs.jline
    implementation libs.jna
    implementation libs.commonmark
    implementation libs.commonmark.ext.gfm.tables
    implementation libs.commonmark.ext.gfm.strikethrough
    implementation files("libs/engine_new.jar")
    implementation files("libs/NCW-Logger-1.0.3-hotfix3.jar")
    implementation files("libs/RichConsole.jar")

    // 可选的 Hook 组件包（本地私有，不进仓库）。放 app/hookpacks/*.jar，目录为空时就是空依赖。
    // 每个 jar 里带一份 hookpack.list，一行一个 Hook 类的全限定名。
    implementation fileTree(dir: "$projectDir/hookpacks", include: ['*.jar'])

    compileOnly libs.xposed.api

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit.v130
    androidTestImplementation libs.androidx.espresso.core.v370
}

// 给 Hook 组件包编译用的 API 包（Hook API + xposed api），只给组件包当 compileOnly，不进 APK。
// 组件包工程里写：compileOnly files("<本仓库>/app/build/hook-api/hook-api.jar")
// 注意：Hook 会碰 android.* 的类，所以组件包工程自己还得有 SDK 的 android.jar。
configurations {
    hookApiExtra {
        canBeConsumed = false
    }
}

dependencies {
    hookApiExtra libs.xposed.api
}

def debugJavacClasses = provider {
    tasks.named('compileDebugJavaWithJavac', JavaCompile).get().destinationDirectory.get().asFile
}

tasks.register('hookApiJar', Jar) {
    group = 'build'
    description = '打包 Hook 组件包编译所需的 hook-api.jar'
    dependsOn 'compileDebugJavaWithJavac'
    archiveFileName = 'hook-api.jar'
    destinationDirectory = layout.buildDirectory.dir('hook-api')
    // 组件包能看到的公开面。
    from(debugJavacClasses) {
        include 'com/justnothing/testmodule/hooks/**'
        include 'com/justnothing/testmodule/constants/**'
        include 'com/justnothing/testmodule/utils/**'
        include 'com/justnothing/testmodule/service/**'
        exclude 'com/justnothing/testmodule/hooks/HookEntry.class'
        exclude 'com/justnothing/testmodule/hooks/HookPackLoader.class'
        exclude 'com/justnothing/testmodule/hooks/HookPackRegistry.class'
    }
    from({ configurations.hookApiExtra.collect { zipTree(it) } }) {
        include 'de/robv/android/xposed/**'
    }
}

/**
 * 把 app/hookpacks/*.jar 里的 hookpack.list 拼成一份**编译期常量**（HookPackRegistry.java）。
 *
 * 为什么不能在运行时 getResources("hookpack.list")：HookEntry 的静态块在 zygote 进程里执行
 * （EdXposed 调 initZygote 之前得先初始化那个类），而 classloader 找这个条目时会把模块自己的
 * APK 当 zip 打开 —— zygote 从此长期持有 /data/app/<pkg>-<后缀>/base.apk 的 fd。重装模块后
 * 这条 fd 悬空，下一次 fork 时 native 层按路径重开失败，直接 SIGABRT 把整机的新进程全带走
 * （com_android_internal_os_Zygote.cpp:1101 Unable to reopen whitelisted descriptors）。
 *
 * 挪到编译期之后 zygote 里一个文件都不用碰。实测对照过：改之前 zygote 握着那条 fd，
 * 改之后没有。详细来龙去脉见 HookPackLoader 的类注释。
 */
tasks.register('generateHookPackRegistry') {
    group = 'build'
    description = '把 app/hookpacks/*.jar 里的 hookpack.list 拼成 HookPackRegistry.java'

    def hookPackDir = file("$projectDir/hookpacks")
    inputs.dir(hookPackDir).optional()
    outputs.dir(hookPackRegistryDir)

    doLast {
        // 按 jar 文件名的顺序扫、按出现顺序去重，结果稳定（构建缓存才靠得住）。
        def names = new LinkedHashSet<String>()
        fileTree(dir: hookPackDir, include: ['*.jar']).files.sort { it.name }.each { jarFile ->
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry('hookpack.list')
                if (entry == null) {
                    logger.lifecycle("组件包 ${jarFile.name} 里没有 hookpack.list，跳过")
                    return
                }
                zip.getInputStream(entry).withCloseable { input ->
                    input.newReader('UTF-8').readLines().each { line ->
                        def name = line.trim()
                        if (!name.isEmpty() && !name.startsWith('#')) {
                            names.add(name)
                        }
                    }
                }
            }
        }

        def entries = names.collect { '            "' + it + '",' }.join('\n')
        def outFile = new File(hookPackRegistryDir, 'com/justnothing/testmodule/hooks/HookPackRegistry.java')
        outFile.parentFile.mkdirs()
        outFile.setText("""package com.justnothing.testmodule.hooks;

/**
 * 由 {@code generateHookPackRegistry} 在构建期生成，<b>不要手改</b>。
 *
 * <p>内容 = {@code app/hookpacks/*.jar} 里所有 {@code hookpack.list} 的并集。</p>
 *
 * <p>之所以做成常量而不是运行时读清单，见 {@link HookPackLoader} 的类注释。</p>
 */
public final class HookPackRegistry {

    /** 组件包要注册的 Hook 类的全限定名。 */
    public static final String[] HOOK_CLASSES = {
$entries
    };

    private HookPackRegistry() {
        throw new UnsupportedOperationException("不能实例化 HookPackRegistry...");
    }
}
""", 'UTF-8')
        logger.lifecycle("HookPackRegistry: ${names.size()} 个 Hook 类 -> ${outFile}")
    }
}

tasks.named('preBuild') {
    dependsOn 'generateHookPackRegistry'
}


configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion "2.7.0"
        }
    }
}

def debugApkDir = null
androidComponents {
    onVariants(selector().withBuildType('debug'), { variant ->
        debugApkDir = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE)
    })
}

tasks.register('prepareMagiskFiles', Task) {
    group = 'build'
    description = '准备 Magisk 模块的所有文件'
    dependsOn 'assembleDebug'

    doLast {
        def magiskDir = file('build/magisk')
        delete magiskDir
        magiskDir.mkdirs()

        // 结构必须严格照 Magisk 25.x 的模块规范：
        // module.prop / post-fs-data.sh / service.sh 都在**模块根**，
        // 脚本放子目录（以前那个 common/）Magisk 一律不执行。
        file("${magiskDir}/system/bin").mkdirs()
        file("${magiskDir}/system/framework").mkdirs()
        file("${magiskDir}/META-INF/com/google/android").mkdirs()

        // 别用 """ 缩进写：那样每行都会带上前导空格，Magisk 就解析不出 id= 了
        // （以前就是这么写的，很可能正是"安装时把文件解到 /data/adb/modules 根目录"的起因）。
        file("${magiskDir}/module.prop").text =
            "id=JustNothing-module\n" +
            "name=啥也不是的模块\n" +
            "version=${android.defaultConfig.versionName}\n" +
            "versionCode=${android.defaultConfig.versionCode}\n" +
            "author=JustNothing1021\n" +
            "description=一个用来调试安卓开发千奇百怪的诡异问题的Xposed模块/命令行工具, 这个是配套的magisk模块, 会给busybox也顺手装上\n"

        // META-INF 是"这个 zip 能被当成 Magisk 模块刷"的凭证：缺了它安装器不认，
        // 表现是解压得莫名其妙。update-binary 会被 Magisk 自己覆盖（内容不重要，但文件得在），
        // updater-script 里只写 #MAGISK。
        copy {
            from file('magisk/META-INF')
            into file("${magiskDir}/META-INF")
        }
        // 官方文档明确要求不要在模块 zip 里放 install.sh（有历史包袱），权限改在 customize.sh 里设。
        copy {
            from file('magisk/customize.sh')
            into magiskDir
        }
        copy {
            from file('magisk/post-fs-data.sh')
            into magiskDir
        }
        copy {
            from file('magisk/service.sh')
            into magiskDir
        }
        copy {
            from fileTree(dir: 'magisk/system')
            into file("${magiskDir}/system")
        }

        if (debugApkDir == null) {
            throw new GradleException('未找到 debug APK 产物，无法生成 Magisk 模块')
        }
        copy {
            from debugApkDir
            include '*.apk'
            into file("${magiskDir}/system/framework")
            rename { 'methods-client.jar' }
        }

        copy {
            from file('magisk/scripts')
            into file("${magiskDir}/system/bin")
        }

        // Magisk 侧的文件必须是 LF 行尾（包括 update-binary —— 它也是被 shell 执行的）。
        fileTree(dir: magiskDir, includes: ['**/*.sh', 'META-INF/**', 'system/bin/**', 'module.prop']).files.each { f ->
            if (f.isFile()) {
                f.setText(f.getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n'), 'UTF-8')
            }
        }
    }
}


tasks.register('createMagiskZip', Zip) {
    group = 'build'
    description = '创建 Magisk 模块压缩包'

    dependsOn 'prepareMagiskFiles'

    archiveFileName = 'magisk-module.zip'
    destinationDirectory = file('build/outputs')

    from file('build/magisk')
}

afterEvaluate {
    tasks.named('assembleDebug') {
        finalizedBy 'createMagiskZip'
    }
}


// ── vendored: vdexExtractor（把 vdex 里的 dex 反 quicken / de-odex）────────────
// 上游: https://github.com/anestisb/vdexExtractor  @78f283b (2020-05-13, Apache-2.0)
// 本地改动: jni/Android.mk 去掉 -Werror —— 2020 年的 C 代码用现在的 clang 编译会冒出新 warning。

def vdexExtractorProjectDir = file("$rootDir/third_party/vdexextractor")
def vdexExtractorBuildDir = layout.buildDirectory.dir('vdexextractor')

tasks.register('buildVdexExtractor', Exec) {
    group = 'build'
    description = '用 NDK 交叉编译 vendored 的 vdexExtractor（产出各 ABI 的可执行文件）'

    def outDir = vdexExtractorBuildDir.get().asFile
    def ndkDir = new File(android.sdkDirectory, "ndk/${android.ndkVersion}")

    // NDK 缺失时只警告、不打断构建：这个特性是"可选增强"，不该让整个项目编不过
    onlyIf {
        if (!new File(ndkDir, 'ndk-build.cmd').isFile()) {
            logger.warn("跳过 vdexExtractor 构建：未找到 NDK（${ndkDir}）")
            return false
        }
        return true
    }

    inputs.dir(vdexExtractorProjectDir)
    outputs.dir(new File(outDir, 'libs'))
    workingDir vdexExtractorProjectDir
    commandLine "${ndkDir}/ndk-build.cmd",
            "NDK_PROJECT_PATH=${vdexExtractorProjectDir}",
            "APP_BUILD_SCRIPT=jni/Android.mk",
            "NDK_APPLICATION_MK=jni/Application.mk",
            "NDK_OUT=${outDir}/obj",
            "NDK_LIBS_OUT=${outDir}/libs"
}

// 刻意把产物落到 src/main/assets/bin/，而不是 build/ 下的生成目录。
tasks.register('syncVdexExtractorAssets', Copy) {
    group = 'build'
    description = '把编译好的 vdexExtractor 放进 src/main/assets/bin/<abi>/，供运行时提取到设备执行'
    dependsOn 'buildVdexExtractor'
    from(vdexExtractorBuildDir.map { it.dir('libs') }) {
        include '*/vdexExtractor'
    }
    into file('src/main/assets/bin')
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'syncVdexExtractorAssets'
}
